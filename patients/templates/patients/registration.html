
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f7f5;
            margin: 0;
            padding: 40px 16px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #176b4d;
            text-align: center;
        }

        .success {
            background: #e4f7eb;
            color: #176b3a;
            border: 1px solid #a8dfbb;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        form p {
            margin-bottom: 18px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: #176b4d;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #105239;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clinic Patient Registration</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="success" role="status">
                    ✓ {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <p>Enter the patient's details below to register.</p>

        <form action="{% url 'user_registration' %}" method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Register Patient</button>
        </form>
    </div>
</body>
</html>
