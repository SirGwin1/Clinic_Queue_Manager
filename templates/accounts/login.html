{% extends 'base.html' %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark">✚</span>
            <div>
                <strong>ClinicQueue</strong>
                <small>Secure staff access</small>
            </div>
        </div>

        <h1>Welcome back</h1>
        <p class="muted auth-subtitle">Sign in to continue managing today’s patient flow.</p>

        <form method="post" novalidate class="auth-form">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="auth-alert">{{ form.non_field_errors }}</div>
            {% endif %}

            <label class="auth-field" for="id_username">
                <span>Username</span>
                {{ form.username }}
            </label>

            <label class="auth-field" for="id_password">
                <span>Password</span>
                <div class="password-wrap">
                    {{ form.password }}
                    <button type="button" class="password-toggle" id="togglePasswordBtn">Show</button>
                </div>
            </label>

            <button type="submit" class="button primary auth-submit">Log in</button>
        </form>
    </div>
</div>

<script>
    const passwordField = document.getElementById('id_password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    if (passwordField && togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', () => {
            const hidden = passwordField.type === 'password';
            passwordField.type = hidden ? 'text' : 'password';
            togglePasswordBtn.textContent = hidden ? 'Hide' : 'Show';
        });
    }
</script>
{% endblock %}
