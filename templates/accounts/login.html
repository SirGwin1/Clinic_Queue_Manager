{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 mt-5">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">Clinic Queue Manager</h2>
                    <p class="text-muted mb-0">Secure staff access</p>
                </div>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <div class="input-group">
                            {{ form.password }}
                            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const passwordField = document.getElementById('id_password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    togglePasswordBtn.addEventListener('click', () => {
        const hidden = passwordField.type === 'password';
        passwordField.type = hidden ? 'text' : 'password';
        togglePasswordBtn.textContent = hidden ? 'Hide' : 'Show';
    });
</script>
{% endblock %}
