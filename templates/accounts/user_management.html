{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Staff management</h2>
</div>
<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label">Role</label><select name="role" class="form-select"><option value="ADMIN">Administrator</option><option value="RECEPTIONIST">Receptionist</option><option value="DOCTOR">Doctor</option></select></div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Create staff account</button>
        </form>
    </div>
</div>
<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-striped">
            <thead><tr><th>Username</th><th>Name</th><th>Role</th></tr></thead>
            <tbody>
                {% for user in users %}
                <tr><td>{{ user.username }}</td><td>{{ user.get_full_name|default:'-' }}</td><td>{{ user.role }}</td></tr>
                {% empty %}
                <tr><td colspan="3">No staff accounts found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
