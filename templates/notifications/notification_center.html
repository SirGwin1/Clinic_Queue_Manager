{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Notifications</h2>
    <span class="badge bg-primary rounded-pill">{{ unread_count }} unread</span>
</div>
<form method="post">
    {% csrf_token %}
    <div class="list-group">
        {% for item in notifications %}
        <label class="list-group-item {% if not item.is_read %}list-group-item-warning{% endif %}">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" name="notification_ids" value="{{ item.pk }}" class="form-check-input me-2">
                    <strong>{{ item.message }}</strong>
                    <div class="small text-muted">{{ item.created_at|date:'Y-m-d H:i' }}</div>
                </div>
                <span class="badge text-bg-light">{{ item.notification_type }}</span>
            </div>
        </label>
        {% empty %}
        <div class="list-group-item">No notifications yet.</div>
        {% endfor %}
    </div>
    {% if notifications %}
    <button class="btn btn-primary mt-3" type="submit">Mark selected as read</button>
    {% endif %}
</form>
{% endblock %}
